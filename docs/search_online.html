<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="algolia-site-verification" content="EE9B96B9D07D1676" />
  <title>SL5 Aura - Documentation Search</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background-color: #f8f9fa;
      color: #212529;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .search-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 600px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      color: #1a1a1a;
    }
    .lang-row {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    .custom-select-wrapper {
      position: relative;
      display: inline-block;
    }
    .lang-btn {
      padding: 8px 14px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 0.95rem;
      background: #fff;
      cursor: pointer;
      min-width: 190px;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lang-btn:focus {
      outline: 2px solid #0d6efd;
    }
    .lang-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #ced4da;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      z-index: 1000;
      padding: 8px;
      display: none;
      text-align: left;
    }
    .lang-filter-input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 10px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }
    .lang-filter-input:focus {
      outline: 2px solid #0d6efd;
    }
    .lang-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 200px;
      overflow-y: auto;
    }
    .lang-item {
      padding: 7px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .lang-item:hover, .lang-item.highlighted {
      background: #e9ecef;
    }
    .lang-item.selected {
      font-weight: 600;
      color: #0d6efd;
    }
    .search-container {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      min-height: 48px;
    }
    .nav-links {
      margin-top: 24px;
      font-size: 0.9rem;
    }
    .nav-links a {
      color: #0d6efd;
      text-decoration: none;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    kbd {
      font-size: 0.75rem;
      padding: 2px 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #eee;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="search-card">
    <h1>SL5 Aura Documentation Search</h1>
    <div class="lang-row">
      <span>Language <kbd>Ctrl+L</kbd>:</span>
      <div class="custom-select-wrapper" id="custom-select-wrapper">
        <button type="button" class="lang-btn" id="lang-btn">
          <span id="lang-btn-label">English (en)</span>
          <span>▾</span>
        </button>
        <div class="lang-dropdown" id="lang-dropdown">
          <input type="text" class="lang-filter-input" id="lang-filter-input" placeholder="Type language (e.g. de)..." autocomplete="off" />
          <ul class="lang-list" id="lang-list">
            <li class="lang-item selected" data-code="en">English (en)</li>
            <li class="lang-item" data-code="de">Deutsch (de)</li>
            <li class="lang-item" data-code="es">Español (es)</li>
            <li class="lang-item" data-code="fr">Français (fr)</li>
            <li class="lang-item" data-code="hi">हिन्दी (hi)</li>
            <li class="lang-item" data-code="ja">日本語 (ja)</li>
            <li class="lang-item" data-code="ko">한국어 (ko)</li>
            <li class="lang-item" data-code="pl">Polski (pl)</li>
            <li class="lang-item" data-code="pt">Português (pt)</li>
            <li class="lang-item" data-code="pt-BR">Português Brasil (pt-BR)</li>
            <li class="lang-item" data-code="zh-CN">简体中文 (zh-CN)</li>
            <li class="lang-item" data-code="ar">العربية (ar)</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="search-container">
      <div id="docsearch"></div>
    </div>
    <div class="nav-links">
      <a href="../README.html">Back to Documentation</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@docsearch/js@3"></script>
  <script>
    const DEFAULT_LANG = 'de';
    const APP_ID = 'ZYXRBS44SX';
    const API_KEY = 'cb4e4336383a25e26cb07eac118b6317';
    const INDEX_NAME = 'sl5-aura-service';

    const langBtn = document.getElementById('lang-btn');
    const langBtnLabel = document.getElementById('lang-btn-label');
    const langDropdown = document.getElementById('lang-dropdown');
    const langFilterInput = document.getElementById('lang-filter-input');
    const langList = document.getElementById('lang-list');
    const langItems = Array.from(langList.querySelectorAll('.lang-item'));

    let currentSelectedCode = 'en';

    function initDocSearch(selectedLang, queryText = '') {
      const container = document.querySelector('.search-container');
      container.innerHTML = '<div id="docsearch"></div>';
      docsearch({
        container: '#docsearch',
        appId: APP_ID,
        apiKey: API_KEY,
        indexName: INDEX_NAME,
        initialQuery: queryText || '',
        searchParameters: {
          facetFilters: selectedLang ? [`lang:${selectedLang}`] : []
        }
      });

      if (queryText) {
        setTimeout(() => {
          document.querySelector('.DocSearch-Button')?.click();
        }, 120);
      }
    }

    function openDropdown() {
      langDropdown.style.display = 'block';
      langFilterInput.value = '';
      filterItems('');
      langFilterInput.focus();
    }

    function closeDropdown() {
      langDropdown.style.display = 'none';
      langBtn.focus();
    }

    function filterItems(query) {
      const q = query.trim().toLowerCase();
      let firstVisible = null;
      langItems.forEach(item => {
        const text = item.textContent.toLowerCase();
        const code = item.getAttribute('data-code').toLowerCase();
        const matches = text.includes(q) || code.includes(q);
        item.style.display = matches ? '' : 'none';
        item.classList.remove('highlighted');
        if (matches && !firstVisible) {
          firstVisible = item;
        }
      });
      if (firstVisible) {
        firstVisible.classList.add('highlighted');
      }
    }

    function selectLanguage(code, label) {
      currentSelectedCode = code;
      langBtnLabel.textContent = label;
      langItems.forEach(item => {
        if (item.getAttribute('data-code') === code) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      });
      closeDropdown();
      initDocSearch(code);
    }

    langBtn.addEventListener('click', function () {
      if (langDropdown.style.display === 'block') {
        closeDropdown();
      } else {
        openDropdown();
      }
    });

    langFilterInput.addEventListener('input', function () {
      filterItems(this.value);
    });

    langFilterInput.addEventListener('keydown', function (e) {
      const visibleItems = langItems.filter(item => item.style.display !== 'none');
      const currentIndex = visibleItems.findIndex(item => item.classList.contains('highlighted'));

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const nextIndex = (currentIndex + 1) % visibleItems.length;
        visibleItems.forEach(i => i.classList.remove('highlighted'));
        if (visibleItems[nextIndex]) {
          visibleItems[nextIndex].classList.add('highlighted');
          visibleItems[nextIndex].scrollIntoView({ block: 'nearest' });
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        const prevIndex = (currentIndex - 1 + visibleItems.length) % visibleItems.length;
        visibleItems.forEach(i => i.classList.remove('highlighted'));
        if (visibleItems[prevIndex]) {
          visibleItems[prevIndex].classList.add('highlighted');
          visibleItems[prevIndex].scrollIntoView({ block: 'nearest' });
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const target = visibleItems[currentIndex] || visibleItems[0];
        if (target) {
          selectLanguage(target.getAttribute('data-code'), target.textContent);
        }
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeDropdown();
      }
    });

    langList.addEventListener('click', function (e) {
      const item = e.target.closest('.lang-item');
      if (item) {
        selectLanguage(item.getAttribute('data-code'), item.textContent);
      }
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('#custom-select-wrapper')) {
        langDropdown.style.display = 'none';
      }
    });


    window.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'L')) {
        e.preventDefault();
        openDropdown();
        return;
      }

      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'Escape' || e.key === 'Tab' || e.key === 'Enter') return;
      if (e.key.length !== 1) return;

      const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (activeTag === 'input' || activeTag === 'textarea' || activeTag === 'select') return;
      if (langDropdown.style.display === 'block') return;

      const searchBtn = document.querySelector('.DocSearch-Button');
      if (searchBtn) {
        searchBtn.click();
        setTimeout(() => {
          const docSearchInput = document.querySelector('.DocSearch-Input');
          if (docSearchInput && !docSearchInput.value) {
            docSearchInput.value = e.key;
            docSearchInput.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }, 60);
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const metaLang = document.querySelector('meta[name="default-language"]')?.getAttribute('content');
    const requestedLang = urlParams.get('lang') || metaLang || DEFAULT_LANG;
    const requestedQuery = urlParams.get('q') || urlParams.get('query') || '';

    if (requestedLang) {
      const normalized = requestedLang.trim().toLowerCase();
      
      const matchItem = langItems.find(i => i.getAttribute('data-code').toLowerCase() === normalized);
      if (matchItem) {
        currentSelectedCode = matchItem.getAttribute('data-code');
        langBtnLabel.textContent = matchItem.textContent;
        langItems.forEach(i => i.classList.toggle('selected', i === matchItem));
      }
    }

    initDocSearch(currentSelectedCode, requestedQuery);    
    
  </script>
</body>
</html>

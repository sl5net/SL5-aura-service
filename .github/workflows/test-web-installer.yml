name: Test Web Installer

on:
  push:
    paths:
      - 'web_install.sh'
      - '.github/workflows/test-web-installer.yml'
  pull_request:
    paths:
      - 'web_install.sh'
      - '.github/workflows/test-web-installer.yml'
  workflow_dispatch:

jobs:
  test-web-install:
    name: Web Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Execute web installer stream
        shell: bash
        run: |
          START_TS=$(date +%s)
          chmod +x web_install.sh
          bash web_install.sh
          END_TS=$(date +%s)
          DURATION=$((END_TS - START_TS))

          INSTALL_DIR="$HOME/.local/share/sl5-aura-service"
          if [ ! -d "$INSTALL_DIR" ]; then
            echo "::error::Installation directory $INSTALL_DIR does not exist!"
            exit 1
          fi

          DISK_USAGE=$(du -sh "$INSTALL_DIR" | cut -f1)

          echo "### Web Installer Run (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration:** ${DURATION}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Disk Usage:** ${DISK_USAGE}" >> $GITHUB_STEP_SUMMARY

# .github/workflows/mac_recording_trigger.yml
name: CI macOS Recording Trigger

on:
  push:
    branches: [ master, feature/cross-platform-setup-config, ci/mac-cudatext-simulation ]
    paths:
      - 'setup/**'
      - 'scripts/infra/requirements/requirements.txt'
      - 'scripts/infra/requirements/requirements-dev.txt'
      - '.github/workflows/mac_recording_trigger.yml'
  pull_request:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate-macos-setup:
    runs-on: macos-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Cache models and tools
        id: assets-cache
        uses: actions/cache@v4
        with:
          path: |
            ./tools/
            ./LanguageTool-6.6
            ./models/
          key: ${{ runner.os }}-models-tools-${{ hashFiles('**/setup/*.sh') }}
          restore-keys: |
            ${{ runner.os }}-models-tools-

      - name: Install Xcode Command Line Tools
        run: xcode-select --install || true

      - name: Install Homebrew
        run: |
          if ! command -v brew &> /dev/null; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

      - name: Install Pygame dependencies via Homebrew
        run: brew install sdl2 sdl2_image sdl2_mixer sdl2_ttf portmidi

      - name: Run macos_setup.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./setup/macos_setup.sh
          ./setup/macos_setup.sh
      - name: Register CudaText binary path for subsequent steps
        run: |
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          if command -v brew >/dev/null 2>&1; then
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
      #- name: Verify CudaText and Disk Wins plugin setup
      - name: Diagnostic on failure
        if: failure()
        run: |
          echo "BRANCH: ${{ github.ref_name }}"
          echo "=== Diagnostic PATH ==="
          echo "PATH=$PATH"
          echo "=== Diagnostic log/setup/install_cudatext.log ==="
          cat log/setup/install_cudatext.log 2>/dev/null || echo "log/setup/install_cudatext.log not found"
          echo "=== Diagnostic /Applications/CudaText.app ==="
          ls -la /Applications/CudaText.app 2>/dev/null || echo "/Applications/CudaText.app not found"
          ls -la /Applications/CudaText.app/Contents/MacOS 2>/dev/null || echo "Contents/MacOS not found"
          echo "=== Checking Symlinks ==="
          ls -la "$(brew --prefix)/bin/cudatext" 2>/dev/null || echo "No brew symlink"
          ls -la /usr/local/bin/cudatext 2>/dev/null || echo "No /usr/local/bin symlink"

          command -v cudatext || { echo "[ERROR] cudatext binary not found in PATH"; exit 1; }
          
          test -d "${HOME}/.config/cudatext/py/cuda_disk_wins" || test -d "${HOME}/Library/Application Support/CudaText/py/cuda_disk_wins" || { echo "[ERROR] Plugin directory missing"; exit 1; }
          grep -q '"ui_notif": false' "${HOME}/.config/cudatext/settings/user.json" || grep -q '"ui_notif": false' "${HOME}/Library/Application Support/CudaText/settings/user.json" || { echo "[ERROR] ui_notif: false not found in user.json"; exit 1; }
          echo "[OK] CudaText and Disk Wins plugin verification passed."

      - name: Test CudaText Disk Wins live auto-reload on macOS
        run: |
          echo "BRANCH: ${{ github.ref_name }}"
          echo "[CI-DEBUG] Test start at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          echo "Initial CI Content" > /tmp/ci_disk_wins_test.txt
          rm -f /tmp/cuda_disk_wins.log /tmp/cudatext.out || true

          if which cudatext >/dev/null 2>&1; then
            echo "[CI-DEBUG] cudatext found at: $(which cudatext)"
          else
            echo "[ERROR] cudatext binary not found in PATH"; exit 1
          fi

          cudatext -verbose /tmp/ci_disk_wins_test.txt > /tmp/cudatext.out 2>&1 &
          CUDA_PID=$!

          FOUND=0
          for i in $(seq 1 20); do
            if grep -Eqi "Disk Wins|cuda_disk_wins|reloaded" /tmp/cudatext.out 2>/dev/null; then
              echo "[CI-DEBUG] Plugin output seen in cudatext.out after ${i}s"
              FOUND=1
              break
            fi
            sleep 1
          done

          echo "UPDATED_BY_CI_DISK_WINS" > /tmp/ci_disk_wins_test.txt
          sleep 2

          kill "$CUDA_PID" 2>/dev/null || true

          echo "---- /tmp/cudatext.out (tail) ----"
          tail -n 300 /tmp/cudatext.out || true

          echo "---- /tmp/cuda_disk_wins.log (tail) ----"
          tail -n 300 /tmp/cuda_disk_wins.log || true

          for j in $(seq 1 10); do
            sleep 1
            if [ -f /tmp/cuda_disk_wins.log ] && grep -qi "File reloaded from disk: /tmp/ci_disk_wins_test.txt" /tmp/cuda_disk_wins.log; then
              echo "[OK] Plugin-Log Reload-Event"
              break
            else
              if [ "$j" -eq 10 ]; then
                echo "[ERROR] no entry in cuda_disk_wins.log"
                exit 1
              fi
            fi
          done

      - name: Validate scripts/infra/requirements/requirements.txt syntax
        
        
        run: |
          python3 -c "
          from pip._internal.req import parse_requirements
          from pip._internal.network.session import PipSession
          list(parse_requirements('scripts/infra/requirements/requirements.txt', session=PipSession()))
          print('scripts/infra/requirements/requirements.txt syntax is valid')
          "

      - name: Test fresh install of scripts/infra/requirements/requirements.txt
        run: |
          python3 -m venv /tmp/test_venv
          /tmp/test_venv/bin/pip install -r scripts/infra/requirements/requirements.txt
          echo "Fresh install successful"

      - name: Install Development Dependencies
        run: .venv/bin/pip install -r scripts/infra/requirements/requirements-dev.txt

      - name: Run pre-commit hook (dry-run)
        run: |
          brew install unix2dos 2>/dev/null || true
          mkdir -p .git/hooks
          cp scripts/infra/githooks/pre-commit_BACKUP .git/hooks/pre-commit
          bash ./scripts/infra/githooks/pre-commit_BACKUP
          echo "pre-commit hook passed"

      - name: Test Service Initialization
        run: |
          echo "--> Starting service in background..."
          bash ./scripts/restart_venv_and_run-server.sh > service_output.log 2>&1 &

          echo "--> Waiting for successful model load..."
          LOG_FILE="log/aura_engine.log"

          for i in {1..20}; do
            if grep -q "MODEL READY" "$LOG_FILE" 2>/dev/null; then
              echo "Success: Service initialized and models are ready."
              exit 0
            fi
            echo "Waiting... ($i/20)"
            sleep 5
          done

          echo "Error: Service did not initialize successfully in time."
          echo "--- Displaying service startup output ---"
          cat service_output.log
          echo "--- Displaying service log for debugging ---"
          cat "$LOG_FILE" 2>/dev/null || echo "Log file not found."
          exit 1

      - name: Package Assets as Artifact (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sl5-assets-pack-macos
          path: |
            ./LanguageTool-6.6
            ./models/

name: Deploy Documentation
# .github/workflows/deploy-docs.yml
# helpful: https://www.yamllint.com/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ fix/deploy-docs-workflow, feature/algolia-docsearch-multilang ]
    paths:
      - 'doc_sources/**'
      - '.github/workflows/deploy-docs.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          echo "BRANCH: ${{ github.ref_name }}"
          python -m pip install --upgrade pip
          python -m pip install sphinx furo myst-parser sphinx-copybutton

      - name: Get latest release version
        run: |
          echo "DOCS_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)" >> $GITHUB_ENV

      - name: Build documentation
        run: |
          echo "BRANCH: ${{ github.ref_name }}"
          cd doc_sources
          python generate_docs.py
          python generate_docs_index.py
          python -m sphinx -b html . _build/html
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc_sources/_build/html

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-docs-preview
          path: doc_sources/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Wait for build to complete
    if: |
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4


# .github/workflows/languagetool6_health_check.yml
name: LanguageTool-6.6 Health Check

# This workflow runs automatically on any push that modifies files inside the LanguageTool-6.6 directory.
# It also allows for manual runs from the GitHub Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - 'setup/helpers/linux_mac/download_and_extract_helper.sh'
      - 'scripts/py/func/check_for_updates.py'
      - '.github/workflows/languagetool6_health_check.yml'

      
jobs:
  health-check:
    name: Verify LanguageTool Server Startup
    runs-on: ubuntu-latest
    steps:

      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Install downloader dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install requests tqdm

      - name: Download LanguageTool-6.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        
        run: |
          export SL5NET_AURA_PROJECT_ROOT="$(pwd)"
          export EXCLUDE_LANGUAGES="all"
          source setup/helpers/linux_mac/download_and_extract_helper.sh

      - name: Simulate broken LanguageTool and verify repair
        run: |
          JAR="LanguageTool-6.6/languagetool-server.jar"
          test -f "$JAR" || { echo "Precondition failed: $JAR missing after download"; exit 1; }
          rm -f "$JAR"
          python3 -c "
          from scripts.py.func.check_for_updates import verify_and_repair_languagetool
          verify_and_repair_languagetool()
          "
          test -f "$JAR" && [ -s "$JAR" ] && echo "PASS: repaired" || { echo "FAIL: not repaired"; exit 1; }

      - name: Set up Java

        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # A popular open-source distribution of OpenJDK
          java-version: '17'

      - name: Attempt to start LanguageTool-6.6 Server
        # We navigate into the directory to keep the commands clean.
        working-directory: ./LanguageTool-6.6
        run: |
          echo "--> Attempting to start LanguageTool server in the background..."
          # Start the server and send it to the background (&)
          java -cp languagetool-server.jar org.languagetool.server.HTTPServer --port 8082 &
          # Save the Process ID (PID) of the last background command
          SERVER_PID=$!

          echo "--> Waiting up to 40 seconds for the server to respond..."
          for i in {1..40}; do
            # Use curl to check if the server is responding on port 8082.
            # -s: silent, -f: fail fast on server error, -o /dev/null: discard output
          
            if curl -sf -o /dev/null http://localhost:8082/v2/languages; then
              echo "✅ Success: LanguageTool server started and is responding."
              # Cleanly stop the server and exit with success code 0
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          
          echo "❌ Error: LanguageTool server did not respond within 40 seconds."
          echo "It likely crashed on startup. Please check the committed files."
          # Ensure the process is killed (the '|| true' prevents an error if it already crashed)
          kill $SERVER_PID || true
          # Exit with a failure code to make the workflow fail
          exit 1

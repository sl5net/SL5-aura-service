name: Self-Test (Container Manjaro Aura & Input)

on:
  push:
    branches: [ master, ci/manjaro-container-workflow ]
    paths-ignore:
      - 'doc_sources/**'
      - 'docs/**'
      - '**.md'
      - '**.rst'
      - '**.html'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'doc_sources/**'
      - 'docs/**'
      - '**.md'
      - '**.rst'
      - '**.html'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  run-input-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Load uinput kernel module on Host
        run: |
          sudo modprobe uinput
          sudo chmod 666 /dev/uinput

      - name: Build Aura Manjaro Test Docker Image
        run: |
          docker build -t aura-manjaro-tester -f setup/docker/manjaro/Dockerfile .

      - name: Start Aura Manjaro Test Container
        run: |
          docker run -d --name aura-manjaro-container \
            --privileged \
            --device /dev/uinput \
            -v ${{ github.workspace }}:/app \
            aura-manjaro-tester \
            tail -f /dev/null

      - name: Run E2E Input Simulation Test
        run: |
          # Execute the typing simulation inside the running container
          docker exec aura-manjaro-container bash -c '
            # Prepare configuration override to force dotool input method
            mkdir -p /tmp/sl5_aura/settings_py_backup
            echo "dotool" > /tmp/sl5_aura/settings_py_backup/x11_input_method_OVERRIDE.txt

            # Start type_watcher in the background
            bash scripts/type_watcher/type_watcher.sh &
            WATCHER_PID=$!
            sleep 3

            # Verify that the watcher started successfully and did not crash
            if ! kill -0 $WATCHER_PID 2>/dev/null; then
              echo " ERROR: Watcher failed to start!"
              exit 1
            fi

            # Simulate incoming long text file (the weather forecast)
            mkdir -p /tmp/sl5_aura/tts_output
            echo "Aktuell in reutlingen sind es 31 Grad, gefuehlt wie 30 Grad. Die Vorhersage meldet: Sonnig." > /tmp/sl5_aura/tts_output/tts_output_99999.txt

            # Give it enough time to fully process and type the text
            sleep 6

            # Verify that the watcher is still running (proves it did not exit with status 124/set -e)
            if ! kill -0 $WATCHER_PID 2>/dev/null; then
              echo " ERROR: Watcher crashed while or after typing the long text!"
              echo "--- log/type_watcher.log ---"
              cat log/type_watcher.log || echo "no log file found"
              exit 1
            fi

            echo " SUCCESS: Watcher successfully completed typing without crashes!"
            kill $WATCHER_PID
          '

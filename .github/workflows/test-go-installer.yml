name: Test Go Installer

on:
  push:
    paths:
      - '.github/workflows/test-go-installer.yml'
      - 'tools/installer/main.go'
  pull_request:
    paths:
      - '.github/workflows/test-go-installer.yml'
      - 'tools/installer/main.go'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        os:
          #- ubuntu-latest
          #- windows-latest
          - macos-latest


    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Code analysis and vet
        working-directory: tools/installer
        run: |
          go vet main.go

      - name: Compile installer binary
        working-directory: tools/installer
        run: |
          go build -v -o aura-installer main.go

      - name: Run installer end-to-end
        working-directory: tools/installer
        shell: bash
        env:
          AURA_INSIDE_TERMINAL: "1"
        run: |
          ./aura-installer
          
          

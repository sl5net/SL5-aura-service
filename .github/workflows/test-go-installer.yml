name: Test Go Installer

on:
  push:
    paths:
      - '.github/workflows/test-go-installer.yml'
      - 'tools/installer/main.go'
  pull_request:
    paths:
      - '.github/workflows/test-go-installer.yml'
      - 'tools/installer/main.go'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: tools/installer/go.mod

      - name: Code analysis and vet
        working-directory: tools/installer
        run: |
          go vet ./...

      - name: Compile installer binary
        working-directory: tools/installer
        run: |
          go build -v -o aura-installer .
